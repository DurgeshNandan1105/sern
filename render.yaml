services:
  # SERN FastAPI Backend Service
  - type: web
    name: sern-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: DB_ENGINE
        value: sqlite
      - key: CORS_ORIGINS
        value: "*"
